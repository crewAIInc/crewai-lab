[project]
name = "triagex_flow"
version = "0.1.0"
description = "TriageX: triage GitHub issues/PRs from a date range (deployable module 02 use case)"
authors = [{ name = "CrewAI Workshop", email = "lorenze@crewai.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai==1.15.5",
    "crewai-tools==1.15.5",
    "python-dotenv>=1.1.0,<2",
]

[project.scripts]
kickoff = "triagex_flow.main:kickoff"
run_crew = "triagex_flow.main:kickoff"
plot = "triagex_flow.main:plot"
run_with_trigger = "triagex_flow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
