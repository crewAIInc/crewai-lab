[project]
name = "triagex_flow_imp"
version = "0.1.0"
description = "TriageX-Imp: self-improving triage with human verification (module 04 use case)"
authors = [{ name = "CrewAI Workshop", email = "lorenze@crewai.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai==1.15.5",
    "crewai-tools==1.15.5",
    "python-dotenv>=1.1.0,<2",
]

[project.scripts]
kickoff = "triagex_flow_imp.main:kickoff"
run_crew = "triagex_flow_imp.main:kickoff"
plot = "triagex_flow_imp.main:plot"
run_with_trigger = "triagex_flow_imp.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
